name: Production Vehicle Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'Assets/TruckSystem/Prefabs/Imported/**'
      - 'Assets/TruckSystem/Data/Production/**'
      - 'Assets/Resources/TruckSystem/Data/Production/**'
      - 'Assets/TrailerSystem/Prefabs/Imported/**'
      - 'Assets/TrailerSystem/Data/Trailers/**'
      - 'Assets/TrailerSystem/Production/**'
      - 'Assets/Scripts/Truck/**'
      - 'Assets/Scripts/TrailerSystem/**'
      - 'Assets/Tests/Editor/TruckProductionAssetTests.cs'
      - 'Assets/Tests/Editor/TrailerProductionAssetTests.cs'
      - 'Assets/Tests/Editor/ProductionVehicleIntegrationTests.cs'
      - 'Packages/**'
      - 'ProjectSettings/ProjectVersion.txt'
      - '.github/workflows/production-vehicle-validation.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: production-vehicle-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editmode:
    name: Production vehicle EditMode tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Cache Unity packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/unity3d
          key: unity-${{ runner.os }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            unity-${{ runner.os }}-

      - name: Run production vehicle tests
        uses: game-ci/unity-test-runner@v4.3.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.0.65f1
          customImage: unityci/editor:ubuntu-6000.0.65f1-base-3
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          testMode: editmode
          artifactsPath: artifacts/production-vehicle-tests
          customParameters: -nographics -batchmode

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-vehicle-test-results
          path: |
            artifacts/production-vehicle-tests
            Logs/UnityDiagnostics
          if-no-files-found: ignore
