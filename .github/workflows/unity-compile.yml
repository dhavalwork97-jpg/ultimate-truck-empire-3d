name: Unity Compile Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unity-compile:
    name: Unity C# Compile Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Unity-Library-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Unity-Library-${{ runner.os }}-

      - name: Unity compile check
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .
          unityVersion: 6000.0.65f1
          targetPlatform: StandaloneLinux64

      - name: Report
        if: always()
        run: echo "Unity compile validation completed."
