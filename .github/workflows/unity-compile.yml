name: Unity Compile Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unity-compile:
    name: Unity C# Compile Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo docker system prune -af || true
          df -h

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Unity-Library-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Unity-Library-${{ runner.os }}-

      - name: Verify generated Unity files are ignored
        run: |
          git status --short
          test -z "$(git status --short --untracked-files=all -- Library)" || {
            echo "Library/ must remain ignored and untracked."
            exit 1
          }

      - name: Pre-pull Unity GameCI image with retry
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          image="unityci/editor:ubuntu-6000.0.65f1-base-3"
          for attempt in 1 2 3 4 5; do
            echo "Pulling $image (attempt $attempt/5)"
            if docker pull "$image"; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "Failed to pull $image after 5 attempts."
          exit 1

      - name: Unity compile check
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.0.65f1
          targetPlatform: StandaloneLinux64
          customImage: unityci/editor:ubuntu-6000.0.65f1-base-3

      - name: Report
        if: always()
        run: echo "Unity compile validation completed."
