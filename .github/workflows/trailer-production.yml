name: Trailer Production CI

on:
  push:
    branches: [main]
    paths:
      - 'Assets/TrailerSystem/Imports/Trailers/Batch01/**'
      - 'Assets/Scripts/TrailerSystem/Editor/**'
      - '.github/workflows/trailer-production.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Trailer and truck production both write generated assets to main.
  # A shared queue prevents simultaneous generated-asset commits from racing.
  group: production-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-trailers:
    name: Headless trailer asset preparation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache Unity packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/unity3d
          key: unity-${{ runner.os }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            unity-${{ runner.os }}-
      - name: Pre-pull Unity GameCI image
        shell: bash
        run: |
          set -euo pipefail
          docker pull unityci/editor:ubuntu-6000.0.65f1-base-3
      - name: Prepare imported trailer production assets
        uses: game-ci/unity-builder@v4.3.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.0.65f1
          customImage: unityci/editor:ubuntu-6000.0.65f1-base-3
          buildMethod: UltimateTruckEmpire.TrailerSystem.Editor.TrailerAssetImportPipeline.PrepareAllImportedBatch
          customParameters: -nographics -batchmode
      - name: Persist generated trailer production assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Unity may create additional generated/meta files during preparation.
          # Stage the complete production tree so no unstaged generated files
          # block the rebase/push step.
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist generated Batch 01 trailer production assets"
          # Unity can leave transient tracked/untracked changes outside the
          # production tree. Stash those transient changes before rebasing so
          # they cannot make git rebase refuse to start.
          git stash push --include-untracked -m "unity-production-transient"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              git stash drop || true
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          git stash drop || true
          exit 1
      - name: Upload generated trailer assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepared-trailer-assets
          path: |
            Assets/TrailerSystem/Prefabs/Imported
            Assets/TrailerSystem/Data/Trailers
            Assets/TrailerSystem/Production/Materials
            Assets/TrailerSystem/Production/Reports/Batch01Validation.json
          if-no-files-found: ignore
