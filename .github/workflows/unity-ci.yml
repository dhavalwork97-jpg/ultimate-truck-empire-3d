name: Unity CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Unity compile and tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Prepare runner
        shell: bash
        timeout-minutes: 5
        run: |
          set -euxo pipefail
          echo "Disk usage before cleanup:"
          df -h
          docker system df || true

          # Remove only large preinstalled SDK/toolchains. Do not run a full
          # Docker prune: GameCI needs Docker to launch the Unity image.
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true

          echo "Disk usage after cleanup:"
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Unity packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/unity3d
          key: unity-${{ runner.os }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            unity-${{ runner.os }}-

      - name: Validate Unity project
        uses: game-ci/unity-test-runner@v4.3.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.0.65f1
          customImage: unityci/editor:ubuntu-6000.0.65f1-base-3
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          testMode: all
          artifactsPath: artifacts/tests
          customParameters: -nographics -batchmode

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results
          path: |
            artifacts/tests
            Logs/UnityDiagnostics
            Library/Bee/backend.log
            Library/LastBuild.buildreport
          if-no-files-found: ignore
