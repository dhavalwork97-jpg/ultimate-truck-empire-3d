# Production-state validation trigger
name: Unity CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: unity-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Full Unity compile and tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout current production state
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache Unity packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/unity3d
          key: unity-${{ runner.os }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            unity-${{ runner.os }}-

      - name: Validate Unity project
        uses: game-ci/unity-test-runner@v4.3.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.0.65f1
          customImage: unityci/editor:ubuntu-6000.0.65f1-base-3
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          testMode: all
          artifactsPath: artifacts/tests
          customParameters: -nographics -batchmode

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results
          path: |
            artifacts/tests
            Logs/UnityDiagnostics
            Library/Bee/backend.log
            Library/LastBuild.buildreport
          if-no-files-found: ignore
