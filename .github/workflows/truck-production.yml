name: Truck Production CI

on:
  # Run on every main push so headless truck preparation cannot be skipped
  # by path-filter evaluation or changes outside the truck asset folders.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: truck-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-trucks:
    name: Headless truck production preparation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Unity-Library-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Unity-Library-${{ runner.os }}-

      - name: Cache Unity packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/unity3d
          key: unity-${{ runner.os }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            unity-${{ runner.os }}-

      - name: Pre-pull Unity GameCI image with retry
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          image="unityci/editor:ubuntu-6000.0.65f1-base-3"
          for attempt in 1 2 3 4 5; do
            echo "Pulling $image (attempt $attempt/5)"
            if docker pull "$image"; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "Failed to pull $image after 5 attempts."
          exit 1

      - name: Prepare imported truck production assets
        uses: game-ci/unity-builder@v4.3.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.0.65f1
          customImage: unityci/editor:ubuntu-6000.0.65f1-base-3
          buildMethod: UltimateTruckEmpire.Truck.Editor.TruckAssetImportPipeline.PrepareAllImportedHeadless
          customParameters: -nographics -batchmode

      - name: Persist generated truck production assets
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Assets/TruckSystem/Imports \
            Assets/TruckSystem/Prefabs/Imported \
            Assets/TruckSystem/Data/Production \
            Assets/TruckSystem/Production
          if git diff --cached --quiet; then
            echo "No generated truck changes to persist."
            exit 0
          fi
          git commit -m "Persist generated truck production assets [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Upload generated truck production assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepared-truck-assets
          path: |
            Assets/TruckSystem/Prefabs/Imported
            Assets/TruckSystem/Data/Production
          if-no-files-found: ignore
