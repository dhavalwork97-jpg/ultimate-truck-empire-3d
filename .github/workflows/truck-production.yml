name: Truck Production CI

on:
  push:
    branches: [main]
    paths:
      - 'Assets/TruckSystem/Imports/Trucks/Batch02/**'
      - 'Assets/Scripts/Truck/Editor/**'
      - '.github/workflows/truck-production.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Trailer and truck production both write generated assets to main.
  # A shared queue prevents simultaneous generated-asset commits from racing.
  group: production-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-trucks:
    name: Headless truck production preparation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Unity-Library-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Unity-Library-${{ runner.os }}-

      - name: Cache Unity packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/unity3d
          key: unity-${{ runner.os }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            unity-${{ runner.os }}-

      - name: Pre-pull Unity GameCI image with retry
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          image="unityci/editor:ubuntu-6000.0.65f1-base-3"
          for attempt in 1 2 3 4 5; do
            echo "Pulling $image (attempt $attempt/5)"
            if docker pull "$image"; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "Failed to pull $image after 5 attempts."
          exit 1

      - name: Prepare imported truck production assets
        uses: game-ci/unity-builder@v4.3.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.0.65f1
          customImage: unityci/editor:ubuntu-6000.0.65f1-base-3
          buildMethod: UltimateTruckEmpire.Truck.Editor.TruckAssetImportPipeline.PrepareAllImportedHeadless
          customParameters: -nographics -batchmode

      - name: Persist generated truck production assets
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Unity's container can leave generated files owned by root. Never
          # reset/clean the Unity worktree after generation: those files may be
          # non-removable by the runner user. Copy only the production outputs
          # into a fresh host-side git worktree and commit from there.
          rm -rf /tmp/truck-production-worktree /tmp/generated-truck-production
          mkdir -p /tmp/generated-truck-production

          for path in \
            Assets/TruckSystem/Data/Production \
            Assets/TruckSystem/Prefabs/Imported \
            Assets/Resources/TruckSystem/Data/Production; do
            if [ -e "$path" ]; then
              mkdir -p "/tmp/generated-truck-production/$(dirname "$path")"
              cp -a "$path" "/tmp/generated-truck-production/$path"
            fi
          done

          git fetch origin main
          git worktree add --detach /tmp/truck-production-worktree origin/main

          cd /tmp/truck-production-worktree
          for path in \
            Assets/TruckSystem/Data/Production \
            Assets/TruckSystem/Prefabs/Imported \
            Assets/Resources/TruckSystem/Data/Production; do
            if [ -e "/tmp/generated-truck-production/$path" ]; then
              rm -rf "$path"
              mkdir -p "$(dirname "$path")"
              cp -a "/tmp/generated-truck-production/$path" "$path"
            fi
          done

          git add -A Assets/TruckSystem/Data/Production Assets/TruckSystem/Prefabs/Imported Assets/Resources/TruckSystem/Data/Production
          if git diff --cached --quiet; then
            echo "No generated truck changes to persist."
            exit 0
          fi
          git commit -m "Persist generated truck production assets"
          git push origin HEAD:main

      - name: Upload generated truck production assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepared-truck-assets
          path: |
            Assets/TruckSystem/Prefabs/Imported
            Assets/TruckSystem/Data/Production
          if-no-files-found: ignore
